<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="lucide.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: oklch(0.23 0.005 265); }
body {
  font: 500 13px/1 -apple-system, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none; color: oklch(0.95 0.004 265);
  display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px;
}
.tile { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: oklch(0.72 0.16 163); color: white; }
.tile.arme { background: oklch(0.6 0.17 265); }
.tile.veille { background: oklch(0.42 0.01 265); color: oklch(0.9 0.004 265); }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.9; }
.txt { min-width: 0; display: grid; gap: 3px; }
.a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.g { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: oklch(0.74 0.008 265); }
#contenu { display: contents; }
</style>
</head>
<body>
<div id="contenu"><div class="tile" id="ic"><i data-lucide="hand"></i></div><div class="txt"><div class="a" id="a">Gestes</div><div class="g" id="g"></div></div></div>
<script>
function montrer(libelle, icone, geste, ton) {
  document.getElementById("ic").className = "tile" + (ton ? " " + ton : "");
  document.getElementById("a").textContent = libelle;
  document.getElementById("g").textContent = geste || "";
  document.getElementById("ic").innerHTML = `<i data-lucide="${icone}"></i>`;
  lucide.createIcons();
}
lucide.createIcons();
</script>
</body>
</html>
